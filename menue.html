<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e7e4df">
  <title>Menu — YamYam Berlin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="cookie-banner.css">
  <style>
    .menu-pdf {
      max-width: var(--page-width);
      margin: 24px auto;
      padding: 0 var(--gap);
    }
    .pdf-page {
      width: 100%;
      margin-bottom: 16px;
      background: var(--bg);
    }
    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .pdf-error {
      font-family: var(--font-body);
      font-size: 14px;
      text-align: center;
      padding: 40px 0;
    }
    @media (min-width: 901px) {
      .menu-pdf {
        max-width: 60vw;
        padding: 0;
      }
    }
    @media (max-width: 900px) {
      .menu-pdf {
        margin: 16px auto;
        padding: 0 16px;
      }
      .pdf-page {
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body style="padding-top: var(--nav-height)">

  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="site-nav__inner">
      <a href="index.html" class="site-nav__logo" aria-label="YamYam Berlin Home">
        <img src="images/logos/YY_Logo_Red.svg" alt="YamYam Berlin">
      </a>
      <div class="site-nav__menu">
        <ul class="site-nav__links site-nav__links--left" role="list">
          <li class="mobile-only"><a href="index.html">Home</a></li>
          <li><a href="menue.html" class="active">Menue</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="jobs.html">Jobs</a></li>
        </ul>
        <ul class="site-nav__links site-nav__links--right" role="list">
          <li><a href="#tebi-reservations">Reserve</a></li>
          <li><a href="https://wolt.com/en/deu/berlin/restaurant/yamyam" target="_blank" rel="noopener">Order Online</a></li>
          <li class="mobile-only"><a href="datenschutz.html">Impressum &amp; Datenschutz</a></li>
          <li>
            <a href="https://www.instagram.com/yamyamberlin" target="_blank" rel="noopener" class="site-nav__ig" aria-label="Instagram">
              <img src="images/icons/ig_icon.svg" alt="Instagram" width="28" height="28">
            </a>
          </li>
        </ul>
      </div>
      <button class="site-nav__burger" aria-label="Menu öffnen" aria-expanded="false">
        <img src="images/icons/burger.png" alt="">
      </button>
    </div>
  </nav>

  <!-- NAV GRADIENT FADER -->
  <div class="nav-gradient-fader">
    <img src="images/backgrounds/yy_gradient_fader_nav_03.png" alt="">
  </div>

  <main class="menu-pdf" role="main">
    <div id="pdf-viewer"></div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer__inner">
      <a href="index.html" class="site-footer__logo">
        <img src="images/logos/YY_Logo_Red.svg" alt="YamYam Berlin" height="32">
      </a>
      <p class="site-footer__copy">© Copyright 2026 YamYam Berlin GmbH</p>
      <span></span>
      <a href="datenschutz.html" class="site-footer__legal">Impressum &amp; Datenschutz</a>
    </div>
  </footer>

  <script>
    const burger = document.querySelector('.site-nav__burger');
    const navMenu = document.querySelector('.site-nav__menu');
    if (burger) {
      burger.addEventListener('click', function() {
        const open = navMenu.classList.toggle('open');
        this.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      // Reserve öffnet das Tebi-Widget (Hash-Link, Snippet am Seitenende) — Burger-Menü dabei schließen
      navMenu.querySelectorAll('a[href^="#tebi-"]').forEach(function (link) {
        link.addEventListener('click', function() {
          navMenu.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="pdf-viewer.js"></script>
  <script src="cookie-banner.js" defer></script>
  <!-- Tebi Reservierungs-Widget: Pill unten rechts + öffnet sich über Links mit href="#tebi-reservations".
       data-analytics-passive: Tebi darf keine eigenen Google/Meta-Tags laden (Cookie-Consent liegt bei uns). -->
  <script src="https://live.tebi.co/ecom/widget-manager.js" data-widget-token="768854_66c402aaff7640c94bb29350c259dff28d27b76e03d6a0ce54c68b8d1ab280e5" data-analytics-passive="true" id="tebi" data-no-minify="1"></script>
  <script src="reservations.js" defer></script>
</body>
</html>
