name: Deploy to Production (yamyam-berlin.de)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp to HostEurope
        env:
          FTP_HOST: wp1151551.server-he.de
          FTP_USER: ftp1151551-prod
          FTP_PASS: ${{ secrets.FTP_PASSWORD_PROD }}
        run: |
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-protect-data true;
          set ftp:ssl-force true;
          set ftp:passive-mode true;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u $FTP_USER,$FTP_PASS $FTP_HOST;
          mirror -R --verbose --delete \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob .vscode/ \
            --exclude-glob .DS_Store \
            --exclude-glob _archive/ \
            --exclude-glob c19/ \
            --exclude-glob README.md \
            --exclude-glob CLAUDE.md \
            ./ /
          "