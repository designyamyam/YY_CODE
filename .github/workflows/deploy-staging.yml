name: Deploy to Staging (yy.yamyam-berlin.de)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Patch config.js for staging tab
        run: |
          sed -i "s/MENU:[[:space:]]*'Menue'/MENU: 'Menue_Staging'/" config.js

      - name: Override robots.txt for staging
        run: |
          cat > robots.txt << 'ROBOTS'
          User-agent: *
          Disallow: /
          ROBOTS

      - name: Write admin/config.php from secret (menu PDF upload password)
        env:
          MENU_UPLOAD_PASSWORD: ${{ secrets.MENU_UPLOAD_PASSWORD }}
        run: |
          if [ -n "$MENU_UPLOAD_PASSWORD" ]; then
            HASH=$(openssl passwd -6 "$MENU_UPLOAD_PASSWORD")
            printf "<?php\ndefine('MENU_UPLOAD_PASSWORD_HASH', '%s');\n" "$HASH" > admin/config.php
          else
            echo "MENU_UPLOAD_PASSWORD secret not set - admin upload stays disabled"
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp to HostEurope
        env:
          FTP_HOST: wp1151551.server-he.de
          FTP_USER: ftp1151551-yy
          FTP_PASS: ${{ secrets.FTP_PASSWORD_STAGING }}
        run: |
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-protect-data true;
          set ftp:ssl-force true;
          set ftp:passive-mode true;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u $FTP_USER,$FTP_PASS $FTP_HOST;
          mirror -R --verbose --delete \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob .vscode/ \
            --exclude-glob .DS_Store \
            --exclude-glob _archive/ \
            --exclude-glob uploads/ \
            --exclude-glob menue-paused.html \
            --exclude-glob README.md \
            --exclude-glob CLAUDE.md \
            ./ /;
          rm -f menue-paused.html || echo menue-paused.html-already-removed
          "
