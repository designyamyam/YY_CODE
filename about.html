    body { margin: 0; overflow-x: clip; padding-top: var(--nav-height); }

    .about-hero {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 800px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .about-hero__bg,
    .about-hero__bg img {

      height: 100%;
    }
    .about-hero__bg img {
      display: block;
      object-fit: cover;
      object-position: center;
      opacity: 0.50;
    }

    #about-root {
      position: relative;
      z-index: 1;
      padding-top: 120px;
    }

    .about-section {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 72px var(--gap);
    }
    .about-section__title {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 24px;
    }
    .about-section p {
      font-family: var(--font-body);
      font-size: var(--fs-body);
      color: var(--black);
      margin-bottom: 16px;
      max-width: var(--page-width);
    }

    /* Team */
    .about-team {
      position: relative;
      overflow: hidden;
      padding: 72px var(--gap);
      background: var(--bg);
    }
    .about-team__bg {
      position: absolute; inset: 0; pointer-events: none;
    }
    .about-team__bg img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      opacity: 0.35;
    }
    .about-team__content {
      position: relative; z-index: 1;
      max-width: var(--content-width);
      margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 64px; align-items: center;
    }
    .about-team__img img { width: 100%; display: block; }

    

    .about-impressions {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 72px var(--gap);
    }
    .about-impressions img {
      width: 100%; max-width: var(--page-width);
      display: block; margin-bottom: 24px;
    }

    @media (min-width: 901px) {
      /* Anchor bottom (street + guests) so cover crops the top instead */
      .about-hero__bg img { object-position: center bottom; }
      /* Team BG: content-driven section, image overflows above (under caption) + below into footer.
         72 padding-bottom + 60 margin-bottom + 20 footer padding-top = 152 (matches Impressions→Team) */
      .about-team {
        min-height: auto;
        overflow: visible;
        margin-bottom: 60px;
      }
      .about-team__bg {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }
      .about-team__bg img {
        width: 100%;
        height: auto;
        object-fit: unset;
        display: block;
        transform: scale(1.15);           /* ← Zoom-Faktor */
        transform-origin: center;
      }
    }

    @media (max-width: 900px) {
      .about-team__content { grid-template-columns: 1fr; }
      .about-team { padding-top: 0; }
    }

        <script>
    // Mobile burger nav
    const burger = document.querySelector('.site-nav__burger');
    const navMenu = document.querySelector('.site-nav__menu');
    if (burger) {
      burger.addEventListener('click', function() {
        const open = navMenu.classList.toggle('open');
        this.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      // Reserve öffnet das Tebi-Widget (Hash-Link, Snippet am Seitenende) — Burger-Menü dabei schließen
      navMenu.querySelectorAll('a[href^="#tebi-"]').forEach(function (link) {
        link.addEventListener('click', function() {
          navMenu.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>

  <script>
    async function renderAbout() {
      const sections = await YYSheets.getAboutData();
      const root = document.getElementById('about-root');
      const impressionsIdx = sections.findIndex((s, i) => i > 0 && /impression/i.test(s.headline || ''));
      const captionHtml = impressionsIdx > -1 ? `
          <div class="about-slideshow__caption">
            <h3>${sections[impressionsIdx].headline}</h3>
            ${sections[impressionsIdx].text.split('\n\n').map(p => `<p class="t-body">${p.replace(/\n/g, '<br>')}</p>`).join('')}
          </div>` : '';
      sections.forEach((sec, i) => {
        if (i === 0) {
          root.innerHTML += `<section class="about-section">
            <h2 class="about-section__title">${sec.headline}</h2>
            <div style="max-width:640px">
              ${sec.text.split('\n\n').map(p => `<p class="t-body">${p.replace(/\n/g, '<br>')}</p>`).join('')}
            </div>
          </section>
          <section class="about-slideshow" aria-label="Yam Yam Berlin Impressionen">
            <div class="about-slideshow__inner">
              <div class="about-slideshow__images" id="slideshow-images"></div>
              <img src="images/about/yy_streifen_yellow.svg" alt="" class="about-slideshow__svg about-slideshow__svg--top">
              <img src="images/about/yy_korean_purple.svg" alt="" class="about-slideshow__svg about-slideshow__svg--bottom">
            </div>
          </section>${captionHtml}`;
          return;
        }
        if (i === impressionsIdx) return;
        if (i === 1) {
          root.innerHTML += `<section class="about-team">
            <div class="about-team__bg"><img src="images/backgrounds/yy_Folks_02.png" alt=""></div>
            <div class="about-team__content">
              <div>
                <h2 class="about-section__title">${sec.headline}</h2>
                ${sec.text.split('\n\n').map(p => `<p class="t-body">${p.replace(/\n/g, '<br>')}</p>`).join('')}
                ${sec.cta ? `<a href="jobs.html" class="btn-outline" style="margin-top:20px">${sec.cta} <img src="images/icons/arrow.svg" alt="" class="btn-arrow" width="16" height="16"></a>` : ''}
              </div>
              <div class="about-team__img">
                <img src="images/backgrounds/yy_team.png" alt="YamYam Team">
              </div>
            </div>
          </section>`;
          return;
        }
        root.innerHTML += `<section class="about-section">
          <h2 class="about-section__title">${sec.headline}</h2>
          ${sec.text.split('\n\n').map(p => `<p class="t-body">${p.replace(/\n/g, '<br>')}</p>`).join('')}
          ${sec.cta ? `<a href="jobs.html" class="btn-outline">${sec.cta} <img src="images/icons/arrow.svg" alt="" class="btn-arrow" width="16" height="16"></a>` : ''}
        </section>`;
      });

      const slideshowEl = document.getElementById('slideshow-images');
      if (slideshowEl && YY_CONFIG.SLIDESHOW) {
        YY_CONFIG.SLIDESHOW.forEach((file, i) => {
          const img = document.createElement('img');
          img.src = `images/slideshow/${file}`;
          img.alt = '';
          img.loading = i === 0 ? 'eager' : 'lazy';
          if (i === 0) img.classList.add('active');
          slideshowEl.appendChild(img);
        });
        let currentIndex = 0;
        const slides = slideshowEl.querySelectorAll('img');
        setInterval(() => {
          slides[currentIndex].classList.remove('active');
          currentIndex = (currentIndex + 1) % slides.length;
          slides[currentIndex].classList.add('active');
        }, 5000);
      }
    }
    renderAbout().catch(err => {
      document.getElementById('about-root').innerHTML = '<p style="padding:48px">Inhalte konnten nicht geladen werden.</p>';
      console.error(err);
    });
  </script>
